name: Public Determinism Proof

# The externally-checkable half of the "same input → same output, bit-for-bit"
# claim (the web "How we build" page rests on it). Runs entirely within this
# PUBLIC Apache repo — no private superproject, no proprietary eidos, no secrets —
# so anyone can fork canon and reproduce it.
#
# scripts/det_public_proof.sh (Approach B) builds canon as a MODULE STATIC-LIB N ways and
# links the constant proof/det_proof.cpp fixture, across the cross-stdlib DIAGONAL
# (gcc-15/libstdc++ × clang-21/libc++) x -O{0,3} x -ffp-contract{off,fast}, replays
# proof/corpus/, and asserts the canonical digest (tokenizer/Drain template set +
# failure_lexicon token-scan + det_math entropy) is byte-identical across every build AND
# matches the committed golden (proof/golden.sha256). It is the public twin of the
# superproject's private determinism_bitidentity.sh — one methodology, public scope.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'   # release cut only — the cross-compiler proof gates the tag, not every main push
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'proof/**'
      - 'scripts/det_public_proof.sh'
      - '.github/workflows/determinism-proof.yml'

jobs:
  public-proof:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment (gcc-15 + clang-21 — both legs of the cross-compiler proof)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common && sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && sudo apt-get install -y ninja-build python3 build-essential gcc-15 g++-15 wget lsb-release gnupg
          # Pin the dev-validated CMake 4.3.x workspace-wide (dev/CI parity). coderoast_server arms
          # `import std` (CXX_MODULE_STD, gated by the experimental UUID 451f2fe2 — present only in
          # CMake 4.3.x); Ubuntu's apt cmake (Noble 3.28) lacks that gate. Harmless / kept consistent
          # in repos that don't arm import std yet.
          sudo python3 -m pip install --break-system-packages "cmake==4.3.1"
          hash -r
          case "$(cmake --version | head -1)" in *" 4.3."*) cmake --version ;; *) echo "::error::expected CMake 4.3.x (got: $(cmake --version | head -1))"; exit 1 ;; esac
          # clang-21 (dev compiler) from apt.llvm.org — the base image's bare `clang` is too old
          # to compile std::expected now that the __cpp_concepts<21 shim is retired.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          # The diagonal's clang-21 leg builds against libc++ (clang's native std module ships with
          # libc++-21, NOT libstdc++ — so a clang+libstdc++ leg can't do `import std`). import-std prereq:
          # libc++.modules.json carries a relative source path CMake misresolves to /lib/share/libc++/v1
          # — bridge it once (cxx_modules_migration_contract.md §10.14 / [[import-std-on-server]]).
          sudo apt-get install -y libc++-21-dev libc++abi-21-dev
          sudo mkdir -p /usr/lib/share && sudo ln -sfn /usr/lib/llvm-21/share/libc++ /usr/lib/share/libc++
          # the diagonal invokes g++-15 / clang++-21 directly; align bare gcc/g++/clang/clang++ too.
          # The runner PRE-INSTALLS an older clang as the clang++ alternative, so a plain
          # --install at the same priority silently keeps it — use a high priority AND
          # force --set, then VERIFY (fail here, not later with a cryptic std::expected error).
          sudo update-alternatives --install /usr/bin/gcc     gcc     /usr/bin/gcc-15     1000
          sudo update-alternatives --install /usr/bin/g++     g++     /usr/bin/g++-15     1000
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   1000
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 1000
          sudo update-alternatives --set gcc     /usr/bin/gcc-15
          sudo update-alternatives --set g++     /usr/bin/g++-15
          sudo update-alternatives --set clang   /usr/bin/clang-21
          sudo update-alternatives --set clang++ /usr/bin/clang++-21
          g++ --version | head -1
          clang++ --version | head -1
          g++ --version     | grep -qE ' 15\.'        || { echo "ERROR: bare g++ is not gcc-15";        exit 1; }
          clang++ --version | grep -qE 'version 21\.' || { echo "ERROR: bare clang++ is not clang-21 (std::expected would fail)"; exit 1; }

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.28.1"
          home: ${{ env.CONAN_HOME }}
          cache_packages: true
          profile_detect: false

      - name: Setup Conan profiles (BOTH diagonal legs — gcc-15/libstdc++ + clang-21/libc++)
        run: |
          mkdir -p "$CONAN_HOME/profiles"
          cp linux-gcc15-release          "$CONAN_HOME/profiles/linux-gcc15-release"
          cp linux-clang21-libcxx-release "$CONAN_HOME/profiles/linux-clang21-libcxx-release"

      - name: Public determinism proof — cross-compiler byte-identity + golden
        env:
          # Both compilers MUST produce a build, or the cross-compiler property is
          # unverified and the green would be hollow (the gate refuses to pass).
          DETERMINISM_REQUIRE_COMPILERS: "g++ clang++"
        run: bash scripts/det_public_proof.sh
