name: MSVC 14.52 availability spike

# WHY THIS EXISTS — one empirical question, answered for free.
#
# Our Windows/MSVC port is PARKED on a toolchain floor: it needs MSVC >= 14.52.36418,
# which fixes the bugs we hit (the exported defaulted operator== / module-DTO double-free,
# the import-std/stop_token issues, the partitions / global-module-fragment reentrancy).
# The stock GitHub runner ships VS 2026 with the 14.51 toolset, which is ALSO bugged.
#
# This spike answers: "Can we GATHER MSVC >= 14.52.36418 on a stock GitHub runner today,
# for free?" The catalog research (Insiders channel .vsman) showed 14.52.36502 ships ONLY
# via the version-agnostic component `VC.Preview.Tools.x86.x64` — there is NO version-pinned
# `Component.VC.14.52.*`, and the grouped `VC.Tools.x86.x64` resolves to the latest RELEASED
# toolset (14.51). So we install VS Build Tools from the Insiders channel adding the Preview
# component, and assert the gathered toolset is >= the floor (fail loud on a no-op).
#
# It runs in PUBLIC canon → zero Actions minutes billed, no secrets, no proprietary code.
# The compiles under .github/msvc-spike/ are FUNCTIONAL smokes (modules + import std compile
# on the gathered 14.52) — NOT bug discriminators: the eidos miscompile resists synthetic
# reproduction, so validating the actual fix stays a separate private spike (Heph) against
# eidos's own code.
#
# workflow_dispatch ONLY — never runs automatically; costs nothing unless triggered.

on:
  workflow_dispatch:
    inputs:
      min_version:
        description: 'Minimum acceptable MSVC toolset version (the fix floor)'
        required: false
        default: '14.52.36418'

permissions:
  contents: read

jobs:
  gather-msvc-1452:
    runs-on: windows-2025
    env:
      MIN_VERSION: ${{ inputs.min_version || '14.52.36418' }}
      # VS 2026 = major 18; its early channel is 'insiders' (VS 2022's 'pre' was renamed) —
      # only /vs/18/insiders resolves to a real CDN bootstrapper (/vs/18/pre 302s to Bing).
      INSIDERS_BOOTSTRAPPER_URL: 'https://aka.ms/vs/18/insiders/vs_buildtools.exe'
      # The addable component that carries the 14.52 preview toolset (side-by-side). The
      # workload brings the Windows SDK + build infra; this component adds the 14.52 compiler.
      PREVIEW_COMPONENT: 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64'

    steps:
      - uses: actions/checkout@v4

      - name: Report the runner's stock Visual Studio + MSVC toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }

          Write-Host "=== stock VS (vswhere -latest) ==="
          $disp = & $vswhere -latest -products * -property catalog_productDisplayVersion
          $name = & $vswhere -latest -products * -property installationName
          $path = & $vswhere -latest -products * -property installationPath
          Write-Host "displayVersion : $disp"
          Write-Host "installName    : $name"
          Write-Host "installPath    : $path"

          $msvc = Join-Path $path 'VC\Tools\MSVC'
          if (Test-Path $msvc) {
            $sets = Get-ChildItem $msvc -Directory | Sort-Object Name -Descending
            Write-Host "stock MSVC toolsets: $($sets.Name -join ', ')"
            "STOCK_TOOLSET=$($sets[0].Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          }

      - name: Install VS Build Tools — Insiders channel + the 14.52 Preview component (the gather)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools_insiders.exe'
          Write-Host "Downloading $env:INSIDERS_BOOTSTRAPPER_URL"
          Invoke-WebRequest -Uri $env:INSIDERS_BOOTSTRAPPER_URL -OutFile $exe
          if (-not (Test-Path $exe)) { throw "bootstrapper download failed" }

          # Guard the silent-corruption trap: an unregistered aka.ms slug returns a 0-byte /
          # HTML page (not a 404), saved as the .exe → Start-Process "corrupted and unreadable".
          $len = (Get-Item $exe).Length
          $sig = -join ([System.IO.File]::ReadAllBytes($exe)[0..1] | ForEach-Object { [char]$_ })
          Write-Host "downloaded $len bytes, signature '$sig'"
          if ($len -lt 1MB -or $sig -ne 'MZ') {
            throw "downloaded file is not a valid Windows executable (size=$len, sig='$sig') — the bootstrapper URL likely redirected to an error page"
          }

          $installPath = Join-Path $env:RUNNER_TEMP 'VSPreview'
          $vsArgs = @(
            '--quiet', '--norestart', '--wait', '--nocache',
            '--installPath', $installPath,
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.CoreBuildTools',
            '--add', $env:PREVIEW_COMPONENT
          )
          Write-Host "Installing VS Build Tools (Insiders) + $($env:PREVIEW_COMPONENT) to $installPath"
          $proc = Start-Process -FilePath $exe -ArgumentList $vsArgs -Wait -PassThru
          $code = $proc.ExitCode
          Write-Host "installer exit code: $code"

          # 0 = ok, 3010 = ok-reboot-required, 1641 = ok-reboot-initiated.
          if ($code -ne 0 -and $code -ne 3010 -and $code -ne 1641) {
            Write-Host "=== tail of newest VS setup log ==="
            $logs = Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending
            if ($logs) { Get-Content $logs[0].FullName -Tail 80 }
            throw "VS Build Tools install failed (exit $code)"
          }
          if (-not (Test-Path $installPath)) { throw "install path $installPath does not exist after install" }
          "PREVIEW_VS=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: VERDICT — assert the gathered toolset is >= the fix floor (fail loud on no-op to 14.51)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msvc = Join-Path $env:PREVIEW_VS 'VC\Tools\MSVC'
          if (-not (Test-Path $msvc)) { throw "no MSVC toolset dir under $msvc — gather produced nothing" }

          $sets = Get-ChildItem $msvc -Directory | Sort-Object Name -Descending
          Write-Host "gathered toolsets: $($sets.Name -join ', ')"
          $newest = [version]$sets[0].Name
          $floor  = [version]$env:MIN_VERSION
          "PREVIEW_TOOLSET=$($sets[0].Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

          if ($newest -lt $floor) {
            throw "GATHER FAILED: newest toolset $newest < required $floor. The Preview component did not install (silent no-op to the released 14.51 — runner-images #14101) or 14.52 is no longer in the Insiders catalog."
          }
          Write-Host "GATHER OK: $newest >= $floor"

      - name: Locate vcvars64.bat in the gathered install (path is not assumed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-ChildItem -Path $env:PREVIEW_VS -Recurse -Filter vcvars64.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            Write-Host "=== VC tree (3 levels) — vcvars64.bat not found ==="
            Get-ChildItem -Path (Join-Path $env:PREVIEW_VS 'VC') -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize -Wrap
            throw "vcvars64.bat not found under $env:PREVIEW_VS — the build-scripts component did not install"
          }
          Write-Host "vcvars64.bat: $($found.FullName)"
          "VCVARS64=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: GATHERED 14.52 — module + operator== functional smoke (compile + run with 14.52)
        shell: cmd
        run: |
          call "%VCVARS64%" -vcvars_ver=%PREVIEW_TOOLSET% || exit /b 90
          cd /d "%GITHUB_WORKSPACE%\.github\msvc-spike" || exit /b 91
          echo === compiler in use (must be 14.52) ===
          cl 2>&1 | findstr /C:"Version"
          cl /std:c++latest /EHsc /nologo /c geom.ixx || exit /b 1
          cl /std:c++latest /EHsc /nologo main.cpp geom.obj /Fe:repro.exe || exit /b 2
          repro.exe || exit /b 3

      - name: GATHERED 14.52 — import std functional smoke (compile with 14.52)
        shell: cmd
        run: |
          call "%VCVARS64%" -vcvars_ver=%PREVIEW_TOOLSET% || exit /b 90
          cd /d "%GITHUB_WORKSPACE%\.github\msvc-spike" || exit /b 91
          cl /std:c++latest /EHsc /nologo /c "%VCToolsInstallDir%modules\std.ixx" || exit /b 1
          cl /std:c++latest /EHsc /nologo /c importstd_main.cpp || exit /b 2
          echo import std + stop_token OK

      - name: Summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $sum = @()
          $sum += "## MSVC 14.52 availability spike"
          $sum += ""
          $sum += "| signal | value |"
          $sum += "| --- | --- |"
          $sum += "| stock toolset (runner) | ``$($env:STOCK_TOOLSET)`` |"
          $sum += "| gathered toolset | ``$($env:PREVIEW_TOOLSET)`` |"
          $sum += "| fix floor required | ``$($env:MIN_VERSION)`` |"
          $sum += "| component used | ``$($env:PREVIEW_COMPONENT)`` |"
          $sum += ""
          $sum += "Verdict: a green job = MSVC >= the fix floor is gatherable for free on a stock GitHub runner via the Insiders channel + the VC.Preview.Tools component, and it compiles C++23 modules + import std. (The actual eidos miscompile fix is validated separately, against eidos's own code.)"
          $sum -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
