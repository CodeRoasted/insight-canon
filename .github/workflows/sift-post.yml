name: Sift Post

# The privileged poster of the fork-safe Sift dogfood: when CI (sift-mode: public) finishes rendering
# the comment to the sift-comment artifact, post it via the shared coderoast-sift-post reusable
# workflow. It does the ONE privileged thing (post) and never checks out or builds PR code.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  post:
    # Only PR CI runs render a comment to post (push/dispatch/release CI have no PR).
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    permissions:
      pull-requests: write
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-sift-post.yml@main
    secrets: inherit
