name: Determinism Golden Proof

# The cross-toolchain / cross-ISA / cross-OS bit-identity gate — the externally-checkable
# "same input → same output, bit-for-bit" claim. Merges the three former probes (determinism-proof,
# arm64-portability-probe, windows-portability-probe) into ONE matrix + a compare:
#
#   5 legs — gcc-x86 · clang-x86 · gcc-arm64 · clang-arm64 · msvc — each builds canon from source and
#   EMITS its determinism digest (proof/det_proof over proof/corpus). The compare job asserts all five
#   are byte-identical: that IS the proof (no committed golden to go stale). Any divergence FAILS,
#   gating the release. The agreed digest is uploaded as `determinism-golden` — the Release attaches it
#   (per-release artifact, never committed).
#
#   G-SP-4 (ADR 0024 §10.4) rides this gate for free: proof/det_proof composes the product's semantic
#   package set (github + jenkins + test_frameworks, grammar-2) and emits `# semantic_identity <hash>`
#   + the package list as the digest's first lines. So the composed-ruleset content hash is under the
#   SAME 5-leg byte-identity assertion — a cross-OS/ISA divergence in the hash serialization fails the
#   gate. No separate job. G-OUT-6 (ADR 0025) rides the same way: the grammar-2 identity plus the
#   per-file `### run_outcome` console-tail scan surface are in the compared bytes.
#
# PUBLIC + anonymous (no secrets): anyone can fork canon and reproduce it. arm64 + msvc run on HOSTED
# runners only (a self-hosted runner on a public repo = fork-PR RCE); hosted minutes are free here.
#
# Runs on every PR to main (full matrix — determinism is caught in the PR, per Founder direction) and
# as the Release gate (workflow_call) + weekly drift catch + manual dispatch.

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — drift catch

jobs:
  proof-linux:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: gcc,   arch: x86,   runner: ubuntu-latest,    label: "gcc-16 · libstdc++ · x86",  require: "g++",     gcc_profile: linux-gcc16-release,       clang_profile: linux-clang21-libcxx-release }
          - { leg: clang, arch: x86,   runner: ubuntu-latest,    label: "clang-21 · libc++ · x86",   require: "clang++", gcc_profile: linux-gcc16-release,       clang_profile: linux-clang21-libcxx-release }
          - { leg: gcc,   arch: arm64, runner: ubuntu-24.04-arm, label: "gcc-16 · libstdc++ · arm64", require: "g++",    gcc_profile: linux-gcc16-arm64-release, clang_profile: linux-clang21-libcxx-arm64-release }
          - { leg: clang, arch: arm64, runner: ubuntu-24.04-arm, label: "clang-21 · libc++ · arm64", require: "clang++", gcc_profile: linux-gcc16-arm64-release, clang_profile: linux-clang21-libcxx-arm64-release }
    env:
      # PER-LEG. `github.workspace` is one fixed path per repo, so on a PERSISTENT runner two legs of
      # this matrix share a conan home and `actions/cache` extracts into whatever is already there —
      # one leg's cache landing on another leg's leftovers. The cache KEY below is already per-leg;
      # this makes the PATH agree with it. Every leg here is hosted today (fresh workspace each job),
      # so the collision is latent rather than live — it is live in insight-eidos, whose x86 legs route
      # to the self-hosted box and where it broke the v1.8.6 golden proof on a half-downloaded spdlog
      # tarball. The three golden.yaml files are copies; fixing only the one that fired is how they rot.
      CONAN_HOME: ${{ github.workspace }}/.conan2-${{ matrix.arch }}-${{ matrix.leg }}
      # det_public_proof.sh picks the profile matching DETERMINISM_LEG; x86↔arm64 differ only by arch.
      DETERMINISM_GCC_PROFILE: ${{ matrix.gcc_profile }}
      DETERMINISM_CLANG_PROFILE: ${{ matrix.clang_profile }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out malf-toolchain into malf/ (conan profiles; public, anonymous — stays forkable)
        uses: actions/checkout@v5
        with:
          repository: CodeRoasted/malf-toolchain
          path: malf
          fetch-depth: 1
          persist-credentials: false

      - name: Provision gcc-16.2 toolchain (OUR OWN published asset; arm64 auto-picked by uname -m)
        if: matrix.leg == 'gcc'
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gcc@63fb55b5b69fdf3f2a3f514d573f6196c13f41ba

      - name: Provision clang-21 + libc++-21
        if: matrix.leg == 'clang'
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-clang21-libcxx@63fb55b5b69fdf3f2a3f514d573f6196c13f41ba

      - name: Base — ninja + CMake 4.3.x (+ gcc-16.2 /opt wiring on the gcc leg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 build-essential
          # CMake 4.3.x workspace-wide: the import-std experimental gate UUID 451f2fe2 lives only there.
          sudo python3 -m pip install --break-system-packages "cmake==4.3.1"
          hash -r
          case "$(cmake --version | head -1)" in *" 4.3."*) cmake --version ;; *) echo "::error::expected CMake 4.3.x (got: $(cmake --version | head -1))"; exit 1 ;; esac
          if [ "${{ matrix.leg }}" = "gcc" ]; then
            sudo update-alternatives --install /usr/bin/gcc gcc /opt/gcc-16.2/bin/gcc 1000
            sudo update-alternatives --install /usr/bin/g++ g++ /opt/gcc-16.2/bin/g++ 1000
            sudo update-alternatives --set gcc /opt/gcc-16.2/bin/gcc
            sudo update-alternatives --set g++ /opt/gcc-16.2/bin/g++
            # Verify by IDENTITY, not a version grep: bare g++ must BE the wired /opt binary.
            # (First 16.2 run: the old ' 15\.' version-grep literal survived the migration sweep
            # and failed the wired 16.2 compiler; and the g++-15 shim symlinks are dead — the
            # determinism drivers take their compilers from the conan profile since 2026-08-16.)
            test "$(readlink -f "$(command -v g++)")" = /opt/gcc-16.2/bin/g++ \
              || { echo "ERROR: bare g++ is not /opt/gcc-16.2/bin/g++"; exit 1; }
          fi

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.28.1"
          home: ${{ env.CONAN_HOME }}
          cache_packages: false
          profile_detect: false

      - name: Cache conan dep binaries (keyed per arch/leg on the dep set)
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-golden-${{ matrix.arch }}-${{ matrix.leg }}-${{ runner.os }}-${{ hashFiles('core/conanfile.py') }}
          restore-keys: |
            conan-golden-${{ matrix.arch }}-${{ matrix.leg }}-${{ runner.os }}-

      - name: Setup Conan profiles (from malf-toolchain)
        run: |
          mkdir -p "$CONAN_HOME/profiles"
          cp "malf/profiles/${{ matrix.gcc_profile }}"   "$CONAN_HOME/profiles/${{ matrix.gcc_profile }}"
          cp "malf/profiles/${{ matrix.clang_profile }}" "$CONAN_HOME/profiles/${{ matrix.clang_profile }}"
          # settings_user.yml rides with the profiles: the gcc16 profile pins compiler.version=16.2,
          # which conan 2.28.1's built-in settings.yml does not know — without this additive extension
          # the profile fails validation on every fresh or cache-restored home (same single source
          # malf and setup-build-env seed; first 16.2 tag run).
          cp malf/settings_user.yml "$CONAN_HOME/settings_user.yml"

      - name: Determinism proof — ${{ matrix.label }} (sweep-invariance + emit the leg's digest)
        env:
          DETERMINISM_LEG: ${{ matrix.leg }}
          DETERMINISM_REQUIRE_COMPILERS: ${{ matrix.require }}
          DETERMINISM_OUT: ${{ github.workspace }}/digest-${{ matrix.arch }}-${{ matrix.leg }}.txt
        run: bash scripts/det_public_proof.sh

      - name: Upload this leg's digest
        uses: actions/upload-artifact@v7
        with:
          name: golden-digest-${{ matrix.arch }}-${{ matrix.leg }}
          path: digest-${{ matrix.arch }}-${{ matrix.leg }}.txt
          if-no-files-found: error

  proof-msvc:
    name: "msvc-14.52 · O2-fast"
    runs-on: windows-2025
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - uses: actions/checkout@v5

      - name: Check out malf-toolchain into malf/ (conan profile; public, anonymous)
        uses: actions/checkout@v5
        with:
          repository: CodeRoasted/malf-toolchain
          path: malf
          fetch-depth: 1
          persist-credentials: false

      - name: Install + activate MSVC 14.52 (the C++23-modules fix floor; not pre-installed)
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-msvc1452@63fb55b5b69fdf3f2a3f514d573f6196c13f41ba

      - name: Verify the active toolset is MSVC 14.52, not a fallback
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not on PATH — MSVC env not activated"; exit 1 }
          if (-not $env:VCToolsVersion) { Write-Error "VCToolsVersion not set — MSVC env not activated"; exit 1 }
          if ([version]$env:VCToolsVersion -lt [version]'14.52') { Write-Error "active toolset $env:VCToolsVersion < 14.52 (the fix floor)"; exit 1 }
          Write-Host "active VCToolsVersion: $env:VCToolsVersion"

      - name: Setup CMake 4.3.x (import-std experimental gate UUID 451f2fe2 lives only in 4.3.x)
        shell: pwsh
        run: |
          python -m pip install "cmake==4.3.1"
          $v = (cmake --version | Select-Object -First 1)
          if ($v -notmatch ' 4\.3\.') { Write-Error "expected CMake 4.3.x (got: $v)"; exit 1 }
          cmake --version

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.29.0"
          home: ${{ env.CONAN_HOME }}
          cache_packages: false
          profile_detect: false

      - name: Cache conan dep binaries
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-golden-msvc1452-${{ runner.os }}-${{ hashFiles('**/conanfile.py', 'malf/profiles/windows-msvc-release') }}
          restore-keys: |
            conan-golden-msvc1452-${{ runner.os }}-

      - name: Setup Conan profile (windows-msvc-release, from malf-toolchain)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CONAN_HOME/profiles" | Out-Null
          Copy-Item malf/profiles/windows-msvc-release "$env:CONAN_HOME/profiles/windows-msvc-release"

      - name: Build det_proof @ O2-fast (canon from source + the public-corpus fixture)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $proofBuild = "build-msvc-proof"
          conan install core `
            --profile:host="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --profile:build="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --build=missing -of $proofBuild
          $toolchain = Get-ChildItem -Path $proofBuild -Recurse -Filter conan_toolchain.cmake | Select-Object -First 1
          if (-not $toolchain) { Write-Error "no conan_toolchain.cmake under $proofBuild"; exit 1 }
          # CELL_FLAGS = SPDLOG off (digest is det_proof's stdout) + /O2 /fp:fast (ship optimization +
          # contraction ON — the dominating corner; matching the other legs proves contraction-invariance).
          cmake -S proof -B $proofBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$($toolchain.FullName)" `
            -DCANON_ROOT="$($PWD.Path)" `
            -DCELL_FLAGS="-DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_OFF /O2 /fp:fast"
          cmake --build $proofBuild --target det_proof
          $det = Get-ChildItem -Path $proofBuild -Recurse -Filter det_proof.exe | Select-Object -First 1
          if (-not $det) { Write-Error "det_proof.exe was not produced — the MSVC det harness build failed"; exit 1 }
          "$($det.FullName)" | Out-File -FilePath det_proof_path.txt -Encoding ascii -NoNewline

      - name: Emit the MSVC digest (det_proof stdout — raw bytes, no re-encoding)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $det = (Get-Content det_proof_path.txt).Trim()
          # ORDINAL, not Sort-Object: det_proof prints one section per argument, so this order IS
          # digest order on one side of a five-leg byte compare. `Sort-Object Name` collates
          # culture-aware, where punctuation is ignorable — measured on pwsh 7.4.6,
          # service.log / service_a.log / service-b.log come back in a different order than
          # `LC_ALL=C sort` gives on the Linux legs (scripts/det_public_proof.sh pins that). Today's
          # seven filenames agree under either; this keeps the agreement from being luck.
          # -Path wildcard, never -Filter: `-Filter` goes to FindFirstFile, which matches a file's
          # 8.3 SHORT name too, so `*.log` there also takes `<name>.logfile`, while the Linux leg
          # globs `*.log`. Two legs enumerating different file sets, on a byte compare.
          $byName = @{}
          Get-ChildItem -Path proof/corpus/*.log -File | ForEach-Object { $byName[$_.Name] = $_.FullName }
          $names = [string[]]$byName.Keys
          [Array]::Sort($names, [StringComparer]::Ordinal)
          $corpus = @($names | ForEach-Object { $byName[$_] })
          if ($corpus.Count -eq 0) { Write-Error "no *.log under proof/corpus"; exit 1 }
          $p = Start-Process -FilePath $det -ArgumentList $corpus -NoNewWindow -Wait -PassThru `
                 -RedirectStandardOutput "$($PWD.Path)/digest-msvc.txt"
          if ($p.ExitCode -ne 0) { Write-Error "det_proof exited $($p.ExitCode)"; exit 1 }
          Write-Host "MSVC digest sha256: $((Get-FileHash -Algorithm SHA256 -Path digest-msvc.txt).Hash.ToLower())"

      - name: Upload the MSVC digest
        uses: actions/upload-artifact@v7
        with:
          name: golden-digest-msvc
          path: digest-msvc.txt
          if-no-files-found: error

  compare:
    needs: [proof-linux, proof-msvc]
    # PUBLIC repo: pinned to hosted — a self-hosted runner reachable from a fork PR is an RCE. Never vars.CI_RUNS_ON here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download every leg's digest
        uses: actions/download-artifact@v7
        with:
          path: digests
          pattern: golden-digest-*

      - name: Compare + validate the golden (all 5 legs must be byte-identical)
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-golden-compare@63fb55b5b69fdf3f2a3f514d573f6196c13f41ba
        with:
          digests-dir: digests
          min-legs: '5'
          out: ${{ github.workspace }}/determinism-golden.txt

      - name: Upload the validated golden (the Release attaches it)
        uses: actions/upload-artifact@v7
        with:
          name: determinism-golden
          path: determinism-golden.txt
          if-no-files-found: error
