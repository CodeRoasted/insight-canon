name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    permissions:
      contents: read
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-ci.yml@main
    with:
      # canon is a tower root (no first-party deps to vendor); 
      # the package is the repo root, so one module '.'.
      modules: '.'
      # PUBLIC repo: sift-mode: public renders the Sift comment fork-safe (read-only token; a fork PR
      # can build here but post nothing) — coderoast-sift-post (via sift-post.yml) posts it. 
      sift-mode: public
    secrets: inherit
