name: CI
permissions:
  contents: write
  # canon is PUBLIC + accepts fork PRs: PR diffing/commenting goes through the fork-safe pair
  # (sift-build.yml renders unprivileged, sift-post.yml posts), NOT this job. Here Sift only SEEDS
  # the last-green baseline on push:main — no PR comment — so no pull-requests: write is needed.
  actions: write         # Sift: upload the baseline-log artifact the fork-safe render reads (last-green)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provision gcc-15.3 toolchain (PR124309 fix; replaces PPA gcc-15 = 15.2)
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gcc153@main

      - name: Setup build env (apt + CMake 4.3.x + Conan + dep cache + canonical profile)
        # Single source: apt base + pinned CMake 4.3.1 + Conan (no autodetect) + the conan dep
        # cache + the canonical linux-gcc15-release profile (fetched from malf-toolchain — no
        # per-repo vendored copy). Owns CONAN_HOME. Replaces the inlined 5-step setup block.
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-build-env@main

      - name: Start build-log capture (the conan-module step below appends; Sift diffs it)
        run: truncate --size 0 "$GITHUB_WORKSPACE/build.log"

      - name: Build and test
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1   # capture the conan-module output for the Sift dogfood
          conan create . \
            --profile:host="$CONAN_HOME/profiles/linux-gcc15-release" \
            --profile:build="$CONAN_HOME/profiles/linux-gcc15-release" \
            --build=missing \
            --build-test=missing

      - name: Sift — seed the baseline on push (PRs handled by the fork-safe sift-build/post pair)
        # PUBLIC repo: only seed the last-green baseline on push:main (no-PR → main.ts seeds). PR diffing +
        # commenting is the fork-safe topology's job (sift-build.yml renders unprivileged, sift-post.yml posts).
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true    # advisory: a Sift error must NEVER fail this build
        uses: CodeRoasted/sift-action@v1
        with:
          log: build.log
          fail-on: none
          commit-comment: regression
          build-status: ${{ job.status == 'success' && 'green' || 'red' }}
