name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    permissions:
      contents: read
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-ci.yml@cad0616a3bbf5b1692cce8b10907085922fcc49e
    with:
      # canon is a tower root (no first-party deps to vendor). Post-ADR-17 it is a MULTI-package
      # repo: the core under core/ (the logcraft/server layout — the repo root is the shelf), the three
      # semantic vocabulary packages under semantic/ (github, gitlab, jenkins, test_frameworks), and the composed
      # bench harness under bench/. Dependency-ordered — each row's `create` publishes into the local
      # cache so the next row's `conan install` resolves it; the semantic packages `require insight_canon`
      # and the bench requires ALL THREE, so the order below is load-bearing (a missing semantic row =
      # the bench falls through to remotes and the release build reds — keep this list 1:1 with
      # packages.yml). test+create both default true; kept explicit so the ordering intent is legible.
      # Building the packages here is what exercises the deepened cross-package C++-module closure
      # (ADR 0024 §7) on every PR, not just at the tag.
      modules: |
        core true true
        semantic/github true true
        semantic/gitlab true true
        semantic/jenkins true true
        semantic/test_frameworks true true
        bench true true
      # PUBLIC repo: sift-mode: public renders the Sift comment fork-safe (read-only token; a fork PR
      # can build here but post nothing) — the sift-post job below posts it.
      sift-mode: public
    secrets: inherit

  # Post the comment the `ci` build rendered to the sift-comment artifact. Separate job so `ci` (which
  # runs PR code) stays read-only; only THIS job holds pull-requests: write, and it runs no PR code —
  # it just posts the pre-rendered artifact of this same run. Same-repo PRs only: a fork PR's
  # pull_request run is read-only, so posting is capped anyway (external forks get no comment).
  sift-post:
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true }}
    permissions:
      pull-requests: write
      actions: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-sift-post.yml@cad0616a3bbf5b1692cce8b10907085922fcc49e
    with:
      run-id: ${{ github.run_id }}
    secrets: inherit
