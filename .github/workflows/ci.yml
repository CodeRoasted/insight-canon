name: CI
permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip build-essential clang-tidy

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          home: ${{ env.CONAN_HOME }}
          cache_packages: true
          profile_detect: false

      - name: Build and test
        run: |
          conan create . \
            --profile:host="$CONAN_HOME/profiles/linux-gcc13-release" \
            --profile:build="$CONAN_HOME/profiles/linux-gcc13-release" \
            --build=missing \
            --build-test=missing
