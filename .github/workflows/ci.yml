name: CI

on:
  workflow_call:     # the Release workflow chains Lint -> CI -> Release
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    # Build + test only, contents:read — canon seeds its Sift baseline via sift-build.yml, so the
    # shared CI dogfood is turned OFF (sift: false). canon is a tower root (no first-party deps to
    # vendor); the package is the repo root, so one module '.'.
    permissions:
      contents: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-ci.yml@main
    with:
      modules: '.'
      sift: false
    secrets: inherit
