name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  ci:
    permissions:
      contents: write
      # Sift needed permissions (PR + actions write)
      pull-requests: write   
      actions: write
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-ci.yml@main
    with:
      modules: '.'
    secrets: inherit
