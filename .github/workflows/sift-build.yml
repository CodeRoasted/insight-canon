# Fork-safe Sift — 1 of 2: UNPRIVILEGED build + render.
#
# Runs on EVERY PR to main, including from forks. READ-ONLY token (no
# pull-requests: write, no secrets), so even though it builds the PR's
# (possibly fork-controlled) code it can post nothing and touch nothing
# privileged. It renders the Sift comment body to an artifact; the poster
# (2 of 2, sift-post.yml) posts it. Canon is the right home: PUBLIC (Apache),
# accepts fork PRs, and `conan create .` needs NO secrets/vendoring.
#
# Requires sift-action's `render` mode (sift_action_contract.md §6.1).
name: Sift (build + render)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read          # checkout only — NO pull-requests: write, NO secrets in this fork-exposed job
  actions: read           # READ-ONLY: resolve the base branch's last-green run + its sift-baseline-log.
                          # A read scope (no write, no secret) → fork-safe. Without it baseline.ts's
                          # runs/artifacts API calls 403 (baseline.ts now degrades to cold start, not error).

jobs:
  sift-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provision gcc-15.3 toolchain (our own toolchain — NO PPA; was PPA gcc-15 = 15.2)
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gcc153@main

      - name: Setup build env (apt + CMake 4.3.x + Conan + dep cache + canonical profile)
        # Fork-safe: setup-gcc153 + setup-build-env are public actions (anonymous, no token).
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-build-env@main

      - id: build
        continue-on-error: true            # a red build must still render a diff
        run: |
          set -o pipefail                  # `| tee` must not mask the build's real exit, else build-status is wrongly green
          conan create . \
            --profile:host="$CONAN_HOME/profiles/linux-gcc15-release" \
            --profile:build="$CONAN_HOME/profiles/linux-gcc15-release" \
            --build=missing --build-test=missing 2>&1 | tee build.log

      - uses: CodeRoasted/sift-action@v1
        if: ${{ always() }}
        with:
          log: build.log
          mode: render                     # engine runs HERE (unprivileged); renders the body to an artifact, never posts
          build-status: ${{ steps.build.outcome == 'success' && 'green' || 'red' }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sift-comment
          path: ${{ runner.temp }}/sift-comment/
          if-no-files-found: error
