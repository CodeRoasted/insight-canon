name: Windows Portability Probe

# STAGED PROBE — not yet a ship gate (Argos 2026-06-13).
#
# canon is proven OS-portable at the SOURCE level: its only Linux coupling is libnuma, fully
# #ifdef INSIGHT_HAS_NUMA-gated, and the NUMA-off build is bit-identical to NUMA-on
# (det_public_proof.sh golden matched with -DINSIGHT_CANON_ENABLE_NUMA=OFF). The remaining
# unknown is the TOOLCHAIN leg: do C++23 named modules + `import std` work on Windows?
#
# WHY MSVC (a probe-proven decision). The first attempt used clang to match the Linux clang-21
# leg; it failed at the import-std generate step — CMake: "Only `libc++` and `libstdc++` are
# supported". The official LLVM Windows release ships no libc++, so clang falls back to the MSVC
# STL, which CXX_MODULE_STD rejects. clang + import std on Windows is a dead end (early 2026).
# MSVC cl.exe is the only mature path: it ships std.ixx and has the most complete import-std
# support (VS 2022 17.5+ / toolset 14.34+). Sources:
#   - https://learn.microsoft.com/en-us/cpp/cpp/tutorial-import-stl-named-module
#   - https://cmake.org/cmake/help/latest/prop_tgt/CXX_MODULE_STD.html  (Ninja-only; MSVC 14.34+)
#
# POSTURE: intentionally NOT a required check and NOT continue-on-error — it must show real red
# or real green so we learn the true state. It cannot gate a ship until it goes green once.
#
# Two things this probe answers, separately:
#  (1) does canon COMPILE under MSVC (named modules + import std)? — the conan-create step.
#  (2) is the MSVC canon digest BYTE-IDENTICAL to the Linux golden? — the determinism-measure step
#      (Daidalos ruling 2026-06-13). MSVC is a third stdlib outside the pinned gcc-15/libstdc++ ≡
#      clang-21/libc++ diagonal, so we MEASURE cross-OS bit-identity rather than assume it; we're
#      Tier-2 until that step goes green. The measure step is non-gating (a mismatch is a result,
#      not a break). See windows-msvc-release header + insight_determinism_model.md.
#
# SCOPE: `conan create .` — which on Windows exercises exactly the right surface:
#   (1) builds canon as a module static-lib (the named-modules + import-std leg under MSVC),
#   (2) builds test_package/ — a DOWNSTREAM consumer that find_package()s insight_canon, does
#       `import insight.canon`, and is itself CXX_MODULE_STD ON (the cross-package module test), and
#   (3) runs that consumer smoke test (can_run is true: native Windows, not a cross-build).
# It does NOT touch canon's own gtest suite — intentional, not a gap: tests/ isn't in
# exports_sources so `conan create` never builds it, AND
# tests/regression/test_tokenizer_loghub_regression.cpp's find_repo_root() calls an UNGUARDED
# fs::directory_iterator that std::terminate()s the whole suite when CWD != the build dir (Argos
# finding, handed to Hephaïstos). When that fix lands, a follow-up step can ctest the full suite.

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'windows-msvc-release'
      - '.github/workflows/windows-portability-probe.yml'

jobs:
  windows-msvc-probe:
    # PINNED windows-2022 (VS 2022, toolset v143/MSVC 19.4x — conan compiler.version=194). The
    # windows-latest runner migrates to VS 2026 (toolset v144) mid-2026; pin for a stable toolset.
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC dev environment (puts cl.exe / link.exe on PATH for Ninja)
        # Ninja cannot discover cl.exe without an activated MSVC environment. This action runs
        # vcvars and exports the toolchain to PATH for every subsequent step. MSVC itself is
        # pre-installed on the runner — no compiler install needed, unlike the Linux clang legs.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify cl.exe is the active compiler (fail here, not later with a cryptic error)
        shell: pwsh
        run: |
          cl.exe 2>&1 | Select-Object -First 1
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not on PATH — MSVC env not activated"; exit 1 }

      - name: Setup CMake 4.3.x (the import-std experimental gate UUID 451f2fe2 lives only in 4.3.x)
        shell: pwsh
        run: |
          python -m pip install "cmake==4.3.1"
          $v = (cmake --version | Select-Object -First 1)
          if ($v -notmatch ' 4\.3\.') { Write-Error "expected CMake 4.3.x (got: $v)"; exit 1 }
          cmake --version

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.29.0"
          home: ${{ env.CONAN_HOME }}
          cache_packages: true
          profile_detect: false

      - name: Setup Conan profile (windows-msvc-release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:CONAN_HOME/profiles" | Out-Null
          Copy-Item windows-msvc-release "$env:CONAN_HOME/profiles/windows-msvc-release"

      - name: Probe — conan create on Windows/MSVC (module lib + downstream import-std consumer)
        # The actual test of C++23 named modules + `import std` under MSVC: conan create builds
        # canon's real CXX_MODULE_STD lib AND test_package/ (a consumer that `import insight.canon`
        # + is itself CXX_MODULE_STD ON), then runs its smoke test. CMake auto-compiles std.ixx into
        # a BMI — no manual std module step needed. NUMA is absent (conanfile gates libnuma to
        # os==Linux → the portable arena allocator compiles). --build=missing builds the third-party
        # deps (fmt/spdlog/simdjson/gtest) for os=Windows/MSVC from source (no prebuilt packages exist).
        # pwsh (not bash): bash's `link` shadows MSVC's link.exe, breaking the link step.
        shell: pwsh
        run: |
          conan create . `
            --profile:host="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --profile:build="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --build=missing

      - name: Measure cross-OS determinism — MSVC canon digest vs the Linux golden
        # Daidalos ruling 2026-06-13 (insight_determinism_model.md § "The cross-OS Tier-1 question"):
        # cross-OS bit-identity is an Eidos prize we MEASURE before claiming, not assume. The probe
        # above proves canon COMPILES on MSVC but emits no digest — so "do we already have cross-OS?"
        # is unanswerable from CI. This step closes that: it's the (N+1)-th "way" of the existing
        # det_public_proof methodology — build canon-MSVC + the det_proof fixture, replay the public
        # corpus, and compare the canonical digest's sha256 to the committed Linux golden.
        #
        # NON-GATING by design: a mismatch is the MEASUREMENT RESULT (we're Tier-2 until proven Tier-1),
        # not a build break — it must not fail the probe or hide behind a green. continue-on-error so a
        # divergence is recorded and visible without blocking; the digest + verdict are printed for the
        # founder/Daidalos to read. Per the ruling's timebox: a hard wall → record it, stay Tier-2, no
        # open-ended hardening front. The integer-only det core (det_math, token-level scan, Drain) makes
        # a MATCH plausible; the real risk is MSVC's std::hash perturbing a map iteration our canonical
        # sort is only proven to tame on two stdlibs — which a mismatch here would localize.
        continue-on-error: true
        shell: pwsh
        run: |
          $proofBuild = "build-msvc-proof"
          # conan install brings the SAME third-party deps the conan-create step built for os=Windows
          # into a toolchain the proof harness can consume (it add_subdirectory()s canon and links it).
          conan install . `
            --profile:host="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --profile:build="$env:CONAN_HOME/profiles/windows-msvc-release" `
            --build=missing -of $proofBuild
          $toolchain = Get-ChildItem -Path $proofBuild -Recurse -Filter conan_toolchain.cmake | Select-Object -First 1
          cmake -S proof -B $proofBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$($toolchain.FullName)" `
            -DCANON_ROOT="$($PWD.Path)"
          cmake --build $proofBuild --target det_proof
          $det = Get-ChildItem -Path $proofBuild -Recurse -Filter det_proof.exe | Select-Object -First 1
          $corpus = Get-ChildItem -Path proof/corpus -Filter *.log | Sort-Object Name | ForEach-Object { $_.FullName }
          # Capture the digest as raw bytes → sha256, mirroring `sha256sum` over det_proof's stdout.
          & $det.FullName @corpus | Out-File -FilePath msvc_digest.txt -Encoding utf8 -NoNewline
          $msvc = (Get-FileHash -Algorithm SHA256 -Path msvc_digest.txt).Hash.ToLower()
          $golden = (Get-Content proof/golden.sha256).Trim().ToLower()
          Write-Host "MSVC canon digest : $msvc"
          Write-Host "Linux golden      : $golden"
          if ($msvc -eq $golden) {
            Write-Host "::notice::CROSS-OS BIT-IDENTICAL — MSVC canon digest == Linux golden. Tier-1 cross-OS is MEASURED (canon-public surface)."
          } else {
            Write-Host "::warning::CROSS-OS DIVERGENCE — MSVC digest != Linux golden. Stay Tier-2; per the determinism-model timebox, record the stage and hand to Daidalos (likely a std::hash map-iteration leak). Per-stage localization is the next step, NOT an open-ended hardening front."
          }
