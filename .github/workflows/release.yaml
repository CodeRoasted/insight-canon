name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write
  # Sift needed permissions (PR + actions write)
  pull-requests: write
  actions: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit
  ci:
    needs: lint
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: ci
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      packages: 'insight_canon:.'
      benchmark: 'insight_canon_bench=insight-canon'
    secrets: inherit
  golden:
    needs: release
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish the determinism golden (+ sha256) to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cp proof/golden.det_proof.txt canon.det_proof.txt
          sha256sum canon.det_proof.txt | awk '{ print $1"  canon.det_proof.txt" }' > canon.det_proof.txt.sha256
          gh release upload "$TAG" canon.det_proof.txt canon.det_proof.txt.sha256 --clobber
