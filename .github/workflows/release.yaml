name: Release

# On a vX.Y.Z tag (or manual re-run): attest -> CI -> Determinism Golden Proof (gate) + the disclosure
# set (gate) -> Release -> attach the golden. The golden gate runs the 5-leg cross-toolchain/ISA/OS
# matrix and only proceeds if every leg's digest is byte-identical; the agreed digest (the validated
# golden) is then attached to the Release as a per-release artifact (never committed). CI is the
# single tag entry point. The lint is step 0's (ADR-2.D3): this tag re-runs none of it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write        # release + attach-golden create/upload the Release
  # Sift needed permissions (PR + actions write)
  pull-requests: write
  actions: write

jobs:
  # ── The tag's ONE gate: the tagged tree is the tree step 0 judged ─────────────────────────────
  # malf-toolchain's `coderoast-attest.yml` proves that the commit this tag points at is the commit
  # step 0's build record (`pharos-build.yml` in the private superproject) verified for this
  # repository, and refuses the tag otherwise (DN-108.D7). Every other job in this file `needs:
  # attest`, so a refusal lands before anything builds or publishes; `pin_coherence` INV-22 holds
  # that shape in every releasing repository. Hosted (no `runs-on`): it compiles nothing, and a
  # release path takes no self-hosted runner it does not need. `BUILD_RECORD_READ_TOKEN` is a
  # fine-grained PAT whose only grant is `Actions: Read-only` on CodeRoasted/coderoast.
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  ci:
    needs: attest
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # The 5-leg determinism gate — blocks the release unless every leg's digest agrees.
  golden:
    needs: [attest, ci]
    uses: ./.github/workflows/golden.yaml

  # OPS-7.O9's PUBLICATION-RUN SEAT. The disclosure bar is "signed record in-tree + exact-set gate in CI
  # on every publication run", and the gate's subject is the REF SET — which refs carry the LogHub
  # slice, the tag being published included, which does not exist when step 0 runs. So it is the
  # one lint.yml job this tag still runs (ADR-2.D3: a gate whose subject is the published ref stays
  # on the publication run), as a job of its own the release needs. The same script is also a job
  # of lint.yml, where step 0's B4 and a pull request read it early: one script, two coordinates.
  disclosure-set:
    needs: attest
    permissions:
      contents: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-script-gate.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    with:
      gates: bash scripts/disclosure_set_lint.sh
      full-history: true

  release:
    needs: [attest, golden, disclosure-set]
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-release.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      # ADR-17.D8: the five semantic vocabulary packages ride the train on the SAME footing as canon
      # (public + release, Apache-2.0). Dependency-ordered — canon first, so its `conan create`
      # populates the cache before each semantic package's create resolves `insight_canon/1.7.5`.
      # The release action verifies each recipe's version == tag and saves a per-package cache tarball.
      packages: |
        insight_canon:core
        insight_semantic_github:semantic/github
        insight_semantic_gitlab:semantic/gitlab
        insight_semantic_jenkins:semantic/jenkins
        insight_semantic_package_managers:semantic/package_managers
        insight_semantic_test_frameworks:semantic/test_frameworks
      # The composed bench harness (benchmarks/ — insight_canon_bench, release:false) is BUILT + RUN by
      # measure-benchmark but never published; its first-party deps resolve as workspace editables
      # from this same tag checkout (measure-benchmark runs `malf bench benchmarks`).
      benchmark: 'insight_canon_bench=insight-canon'
      benchmark-subdir: benchmarks
    secrets: inherit

  # THE SHOWCASE ACT MOVED OUT OF THIS REPO, 2026-08-21 (ADR-33.D8 discharge 1, on the Founder's
  # ratification of ADR-33.D5). It now runs in the PRIVATE superproject as `canon-showcase.yml`.
  #
  # Not a tidy-up: a publication act may occur only where the verdict for the artifact it emits is
  # computable, and it was not computable here. This repo is PUBLIC and the showcase ran
  # anonymously, while the content predicate is 591 lines in the PRIVATE warehouse — so the act
  # publishing the workspace's highest-exposure artifact was structurally the one that could not
  # judge it. Publishing the predicate instead was refused twice (ADR-33.D6/D7): it repairs
  # executability alone, leaving the verdict REFUSED, and it would publish the enumeration of what
  # that predicate cannot see. Capability is a property of the SITE, so the act moved to the judge.
  #
  # `scripts/samples_showcase.sh` STAYS HERE and is still the renderer — the superproject checks
  # this repo out and calls it. What left is the publishing, not the rendering.

  # Attach the validated golden (produced by the golden gate) to the Release — per-release, not committed.
  attach-golden:
    needs: [attest, release, golden]
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attach-golden.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    with:
      asset: canon.det_proof.txt
