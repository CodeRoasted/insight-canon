name: Release

# On a vX.Y.Z tag (or manual re-run): Lint -> CI -> Determinism Golden Proof (gate) -> Release ->
# attach the golden. The golden gate runs the 5-leg cross-toolchain/ISA/OS matrix and only proceeds
# if every leg's digest is byte-identical; the agreed digest (the validated golden) is then attached
# to the Release as a per-release artifact (never committed). CI is the single tag entry point.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write        # release + attach-golden create/upload the Release
  # Sift needed permissions (PR + actions write)
  pull-requests: write
  actions: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  ci:
    needs: lint
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # The 5-leg determinism gate — blocks the release unless every leg's digest agrees.
  golden:
    needs: ci
    uses: ./.github/workflows/golden.yaml

  release:
    needs: golden
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-release.yml@4a03e3a352b9d779305f9a8e38a129717076bf88
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      # ADR-17.D8: the four semantic vocabulary packages ride the train on the SAME footing as canon
      # (public + release, Apache-2.0). Dependency-ordered — canon first, so its `conan create`
      # populates the cache before each semantic package's create resolves `insight_canon/1.7.5`.
      # The release action verifies each recipe's version == tag and saves a per-package cache tarball.
      packages: |
        insight_canon:core
        insight_semantic_github:semantic/github
        insight_semantic_gitlab:semantic/gitlab
        insight_semantic_jenkins:semantic/jenkins
        insight_semantic_test_frameworks:semantic/test_frameworks
      # The composed bench harness (benchmarks/ — insight_canon_bench, release:false) is BUILT + RUN by
      # measure-benchmark but never published; its first-party deps resolve as workspace editables
      # from this same tag checkout (measure-benchmark runs `malf bench benchmarks`).
      benchmark: 'insight_canon_bench=insight-canon'
      benchmark-subdir: benchmarks
    secrets: inherit

  # THE SHOWCASE ACT MOVED OUT OF THIS REPO, 2026-08-21 (ADR-33.D8 discharge 1, on the Founder's
  # ratification of ADR-33.D5). It now runs in the PRIVATE superproject as `canon-showcase.yml`.
  #
  # Not a tidy-up: a publication act may occur only where the verdict for the artifact it emits is
  # computable, and it was not computable here. This repo is PUBLIC and the showcase ran
  # anonymously, while the content predicate is 591 lines in the PRIVATE warehouse — so the act
  # publishing the workspace's highest-exposure artifact was structurally the one that could not
  # judge it. Publishing the predicate instead was refused twice (ADR-33.D6/D7): it repairs
  # executability alone, leaving the verdict REFUSED, and it would publish the enumeration of what
  # that predicate cannot see. Capability is a property of the SITE, so the act moved to the judge.
  #
  # `scripts/samples_showcase.sh` STAYS HERE and is still the renderer — the superproject checks
  # this repo out and calls it. What left is the publishing, not the rendering.

  # Attach the validated golden (produced by the golden gate) to the Release — per-release, not committed.
  attach-golden:
    needs: [release, golden]
    # PUBLIC repo: pinned to hosted — a self-hosted runner reachable from a fork PR is an RCE. Never vars.CI_RUNS_ON here.
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated golden
        uses: actions/download-artifact@v7
        with:
          name: determinism-golden

      - name: Attach the golden (+ sha256) to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # no checkout here — gh can't infer the repo from .git, name it
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mv determinism-golden.txt canon.det_proof.txt
          sha256sum canon.det_proof.txt | awk '{ print $1"  canon.det_proof.txt" }' > canon.det_proof.txt.sha256
          gh release upload "$TAG" canon.det_proof.txt canon.det_proof.txt.sha256 --clobber
