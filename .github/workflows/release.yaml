name: Release

# On a vX.Y.Z tag (or a manual re-run): attest -> the disclosure set -> publish. A RELEASE IS A
# PUBLICATION (DN-142.D9, ROADMAP N360): insight_canon and the five insight_semantic_* packages were
# built, tested and judged once, at step 0, and stored by the writer; the composed benchmark ran
# inside insight_canon_bench's create as a verdict of its own (DN-142.D25 (5), call D), and the
# determinism golden is the agreed digest of the five legs step 0 ingested from this repository's
# `golden.yaml` (DN-142.D25 (3)). `publish` (malf's coderoast-publish.yml) attaches this
# repository's writer-signed slice of the attested step-0 record — the six package transports, the
# benchmark JSON, `canon.det_proof.txt` and the slice — and reads the Release back equal to it, both
# ways. Nothing here builds, tests, measures or packs. This repository is PUBLIC, so every job runs
# on a GitHub-hosted machine, and `publish` reads the private `store-insight-canon` package through
# this repository's Read grant on it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write   # create the Release at the existing tag and upload its assets
  packages: read    # `publish` reads this repository's own store package
  actions: read     # `attest` reads the superproject's step-0 runs (malf coderoast-attest.yml asks it)

jobs:
  # ── The tag's ONE gate: the tagged tree is the tree step 0 judged ─────────────────────────────
  # malf-toolchain's `coderoast-attest.yml` proves that the commit this tag points at is the commit
  # step 0's build record (`pharos-build.yml` in the private superproject) verified for this
  # repository, and that a store writer sealed that record, and refuses the tag otherwise
  # (DN-108.D7). Every other job in this file `needs: attest`, so a refusal lands before anything
  # publishes; `pin_coherence` INV-22 holds that shape in every releasing repository. Hosted (no
  # `runs-on`). `BUILD_RECORD_READ_TOKEN` is a fine-grained PAT whose only grant is
  # `Actions: Read-only` on CodeRoasted/coderoast.
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@e68616f6c1ffca80edb395e35bd1f39671ec83d5
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  # OPS-7.O9's PUBLICATION-RUN SEAT. The disclosure bar is "signed record in-tree + exact-set gate in CI
  # on every publication run", and the gate's subject is the REF SET — which refs carry the LogHub
  # slice, the tag being published included, which does not exist when step 0 runs. So it is the
  # one gate this tag still runs (ADR-2.D3: a gate whose subject is the published ref stays on the
  # publication run), as a job of its own `publish` needs. The same script is also a job of
  # lint.yml, where step 0's B4 and a pull request read it early: one script, two coordinates.
  disclosure-set:
    needs: attest
    permissions:
      contents: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-script-gate.yml@e68616f6c1ffca80edb395e35bd1f39671ec83d5
    with:
      gates: bash scripts/disclosure_set_lint.sh
      full-history: true

  publish:
    needs: [attest, disclosure-set]
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-publish.yml@e68616f6c1ffca80edb395e35bd1f39671ec83d5
    with:
      record-sha256: ${{ needs.attest.outputs.record-sha256 }}
