name: Release

# On a vX.Y.Z tag (or manual re-run): Lint -> CI -> Release. Release publishes the insight_canon
# Conan package + benchmark via the shared coderoast-release reusable workflow, then a bespoke golden
# job attaches the determinism golden. CI is the single tag entry point (no standalone CI-on-tag).
#
# NOTE: the golden job is deliberately BESPOKE, pending the determinism-legs factorisation (golden +
# determinism-proof / arm64 / windows-msvc). It preserves the pre-refactor behaviour (canon's Release
# carried the golden + sha256) so nothing regresses before that discussion.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write        # release + golden jobs create/upload the Release

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  ci:
    needs: lint
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      packages: 'insight_canon:.'
      benchmark: 'insight_canon_bench=insight-canon'
    secrets: inherit

  golden:
    needs: release
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish the determinism golden (+ sha256) to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cp proof/golden.det_proof.txt canon.det_proof.txt
          sha256sum canon.det_proof.txt | awk '{ print $1"  canon.det_proof.txt" }' > canon.det_proof.txt.sha256
          gh release upload "$TAG" canon.det_proof.txt canon.det_proof.txt.sha256 --clobber
