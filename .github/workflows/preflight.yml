name: Preflight

# The cheap checks of this repository, nothing built: actionlint, C++23 module conformance, clang-format
# conformance, the two determinism gates over the core packages.yml declares, and the dead-symbol-in-
# comment gate (malf-toolchain's coderoast-preflight.yml, every leg armed), and canon's own gate
# scripts below. Dispatched alone, or called by CI. PUBLIC repository: every
# job runs on GitHub-hosted machines.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-preflight.yml@4fbd73cb900bf262af003b8326d416afd190e748

  # canon's own gate scripts, through malf-toolchain's script-gate job (ROADMAP N357). PUBLIC repo: no
  # runs-on passthrough — the reusable workflow's hosted default.
  #
  # ADR-17.D1: canon core is semantic-unaware — no ecosystem literal fused into the mechanism (the
  # deny-list is canon-specific, so the script stays here). ADR-29.D5 / ADR-20.D19: on both
  # provenance pairs the seam keeps the plain datum + a separate bool, so each pairing is held by ONE
  # write site; a second write site fails on the commit that adds it. Every gate runs and each red is
  # named. Runs in every CI and in every candidate, whose preflight is this file (DN-142.D33).
  sp1-semantic-unawareness:
    permissions:
      contents: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-script-gate.yml@4fbd73cb900bf262af003b8326d416afd190e748
    with:
      gates: |
        bash scripts/sp1_semantic_unawareness_lint.sh
        bash scripts/provenance_one_write_site_lint.sh declared_timestamp
        bash scripts/provenance_one_write_site_lint.sh declared_level

  # OPS-7.O9: DISCLOSURE.md accepts a CLOSED set of historic refs carrying the LogHub slice; the
  # disclosure bar is "signed record in-tree + exact-set gate in CI on every publication run". This is
  # the gate half, at two coordinates running one script: release.yaml runs it on every publication
  # run (its subject is the ref set, the tag being published included, so ADR-2.D3 keeps it there),
  # and this job gives CI and the candidate the early signal. Exact-set, both directions;
  # the script selftests its red arms on every run, and fails closed on a partial fetch.
  disclosure-set:
    permissions:
      contents: read
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-script-gate.yml@4fbd73cb900bf262af003b8326d416afd190e748
    with:
      gates: bash scripts/disclosure_set_lint.sh
      full-history: true
