packages:
  # Core in core/ (the logcraft/server layout): the repo root is the SHELF (README/LICENSE/
  # workflows/packages.yml/scripts/proof), the tree reads like the architecture —
  # core/ = the language, semantic/* = the vocabularies, benchmarks/ = the composed perf harness.
  insight_canon:
    path: core
    version: 1.10.9
    source_public: true
    release: true
    depends: []
  # Semantic packages (ADR-17.D1): per-dialect VOCABULARY (rule rows + code tier), statically
  # composed via insight::semantic::compose(). One module interface unit each — no partitions (the
  # cross-package BMI closure must not deepen). gcc/cloud are PO-scheduled successors riding the
  # same contract, never pre-built. The licence is declared ONCE, in each package's own
  # conanfile.py `license` attribute — that is the value conan carries into package metadata,
  # and pin_coherence INV-20 checks it against `source_public` here.
  insight_semantic_github:
    path: semantic/github
    version: 1.10.9
    source_public: true
    release: true
    depends: [insight_canon]
  insight_semantic_jenkins:
    path: semantic/jenkins
    version: 1.10.9
    source_public: true
    release: true
    depends: [insight_canon]
  insight_semantic_gitlab:
    path: semantic/gitlab
    version: 1.10.9
    source_public: true
    release: true
    depends: [insight_canon]
  # The package managers' vocabulary (ADR-17.D14): dialect-independent like test_frameworks, its rows
  # projected from package_managers.dialect.yaml as github's are.
  insight_semantic_package_managers:
    path: semantic/package_managers
    version: 1.10.9
    source_public: true
    release: true
    depends: [insight_canon]
  insight_semantic_test_frameworks:
    path: semantic/test_frameworks
    version: 1.10.9
    source_public: true
    release: true
    depends: [insight_canon]
  # The composed benchmark harness (ADR-17.D8 · LSRC-28): a leaf APPLICATION package — the perf gate
  # must link the vocabulary packages, which core never may (ADR-17.D1 / R1).
  # Built + run by `malf bench`
  # and the on-tag measure-benchmark gate; never published as a release artifact.
  insight_canon_bench:
    path: benchmarks
    version: 1.10.9
    source_public: true
    release: false
    depends: [insight_canon, insight_semantic_github, insight_semantic_gitlab, insight_semantic_jenkins, insight_semantic_package_managers, insight_semantic_test_frameworks]
    # DN-142.D22: every executable this package stores, classed `published` (it ships) or
    # `run-from-cache` (a later step runs it from the cache, so it keeps its runpath).
    executables: {bin/insight_canon_bench: run-from-cache}
    # DN-142.D25 (5) call D: the verdict `insight_canon_bench/bench`, run inside this package's create under step 0's
    # `user.malf:bench`; each JSON is published under the name the hub collects.
    objects:
      bench/insight_canon_bench.json: {published: {assets: [{name: insight-canon-benchmark.json}]}}
  # The determinism proof's ship-leg STEP (DN-142.D5 (4)): det_proof linked against the stored canon
  # and semantic packages, the showcase view gate and the proof driver's reporting gate run in its
  # one `conan create`. An application package, never published. proof/CMakeLists.txt serves it and
  # the inventory cell below: the step consumes the packages, the cell (and the 8-cell matrix of
  # scripts/det_public_proof.sh) recompiles canon in its own tree.
  insight_canon_proof:
    path: proof
    version: 1.10.9
    source_public: true
    release: false
    depends: [insight_canon, insight_semantic_github, insight_semantic_gitlab, insight_semantic_jenkins, insight_semantic_package_managers, insight_semantic_test_frameworks]
    # DN-142.D22: every executable this package stores, classed `published` (it ships) or
    # `run-from-cache` (a later step runs it from the cache, so it keeps its runpath).
    executables: {bin/det_proof: run-from-cache}
    # DN-142.D33 (option (i)): a CUT TOOL. The candidate stores its ship form beside what ships, bound to its
    # clang verdict, and never releases it; the cut restores det_proof by key and runs it on the release seat.
    cut_tool:
      why: "the cut's canon-generation job renders canon's projection over the private corpora with this det_proof, and canon-showcase-gate.yml renders the public samples with it"

# ── The build system's INVENTORY (ADR-3.D9) ─────────────────────────────────────────────────────
# Projects that declare their own `project()` and belong to NO conan package. They are NOT
# packages and must not become ones — a package carries one profile and one build, which is
# exactly what would flatten this harness's 8-cell determinism matrix. Inventory membership and
# package membership are two different things (ADR-3.D9); conflating them is what produced the
# orphan. Every entry here is configured + built to a LINKED artifact in ONE canonical cell by
# `malf inventory`, which the build/test sweep runs — so a translation unit can no longer be
# invisible to `malf test` until the tag looks at it.
inventory:
  # proof/ is a REPO-LEVEL harness spanning core/ and semantic/*, which is why no single package
  # could own it — and why it went unbuilt for a whole release cycle at a time. Its first compile
  # used to BE the golden workflow (ADR-3.D9).
  #
  # ⚠ THE BOUNDARY, DECLARED (ADR-3.D9): this entry proves proof/ BUILDS. The 8-cell matrix in
  # scripts/det_public_proof.sh proves it is DETERMINISTIC, at the tag, and is untouched by this.
  # A digest drift still first appears at the cut, BY DESIGN. Do not widen this into an 8-cell run
  # to "make the daily gate complete" — the daily property is compile-and-link, nothing more.
  canon_det_proof:
    path: proof
    toolchain_from: core
    target: det_proof
    defines:
      CANON_ROOT: ${repo}

# DN-142.D25 (3): the hosted output step 0 dispatches and ingests (its stage B5): the determinism
# golden, whose arm64 and MSVC legs run on hosted runners. The run title is the workflow's `name:`.
# Its reading is a verdict B5 owes, published under the name the hub collects.
ingest:
  golden.yaml:
    artifact: determinism-golden
    object: determinism-golden.txt
    commits: [insight-canon, metalog-spec]
    published: {assets: [{name: canon.det_proof.txt}]}

# ── The jobs this repository's release.yaml runs beyond `attest` and `publish` (ROADMAP N394) ──────
# pin_coherence INV-22's shape clause derives the release from this file: a job a tag runs that is
# not declared here, or a declaration the release no longer carries, reds at its commit.
release_jobs:
  disclosure-set: "the exact-set disclosure gate's subject is the ref set the published tag joins, which does not exist when step 0 runs (OPS-7.O9)"

# ── The deterministic-content core the determinism gates judge (malf determinism_lint.py) ────────
# Both gates — the clock (the determinism bible §7) and std <random> (§5 M7/M9) — judge every C/C++
# unit under `roots:`, one subject and one root list; every build target above that no root reaches
# is named under `out_of_scope:` with its reason. malf's coderoast-preflight.yml runs them over this
# repository; the superproject sums the `opt_outs:` budgets across repositories (DN-142.D33).
determinism:
  # core/ whole, every shipped semantic dialect (a dialect that lands unlisted is the drift that missed
  # jenkins at 1.7.7, and the coverage comparison now refuses it), and proof/: a determinism-PROOF
  # harness is COVERED, never excluded — a clock read or a stateful std engine inside it is the defect.
  roots:
    - core/src
    - core/api
    - semantic/github/src
    - semantic/gitlab/src
    - semantic/jenkins/src
    - semantic/package_managers/src
    - semantic/test_frameworks/src
    - proof
  out_of_scope:
    insight_canon_bench: "the composed perf harness (release: false, built and run by malf bench) MEASURES the core and ships no content: a benchmark that may not read a clock cannot time anything, and a draw it makes reaches no consumer of deterministic output"
