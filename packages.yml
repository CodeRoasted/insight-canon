packages:
  # Core in core/ (the logcraft/server layout): the repo root is the SHELF (README/LICENSE/
  # workflows/packages.yml/scripts/proof), the tree reads like the architecture —
  # core/ = the language, semantic/* = the vocabularies, bench/ = the composed perf harness.
  insight_canon:
    path: core
    version: 1.8.4
    license: Apache-2.0
    public: true
    release: true
    depends: []
  # Semantic packages (ADR 0024): per-dialect VOCABULARY (rule rows + code tier), Apache-2.0, statically
  # composed via insight::semantic::compose(). One module interface unit each — no partitions (the
  # cross-package BMI closure must not deepen). gcc/cloud are PO-scheduled successors riding the
  # same contract, never pre-built.
  insight_semantic_github:
    path: semantic/github
    version: 1.8.4
    license: Apache-2.0
    public: true
    release: true
    depends: [insight_canon]
  insight_semantic_jenkins:
    path: semantic/jenkins
    version: 1.8.4
    license: Apache-2.0
    public: true
    release: true
    depends: [insight_canon]
  insight_semantic_test_frameworks:
    path: semantic/test_frameworks
    version: 1.8.4
    license: Apache-2.0
    public: true
    release: true
    depends: [insight_canon]
  # The composed benchmark harness (ADR 0024 / SP-5): a leaf APPLICATION package — the perf gate
  # must link the vocabulary packages, which core never may (SP-1/R1). Built + run by `malf bench`
  # and the on-tag measure-benchmark gate; never published as a release artifact.
  insight_canon_bench:
    path: bench
    version: 1.8.4
    license: Apache-2.0
    public: true
    release: false
    depends: [insight_canon, insight_semantic_github, insight_semantic_jenkins, insight_semantic_test_frameworks]
