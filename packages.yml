packages:
  insight_canon:
    path: .
    version: 1.7.5
    license: Apache-2.0
    public: true
    release: true
    depends: []
  # Semantic packages (ADR 0024): per-dialect VOCABULARY (rule rows + code tier), Apache-2.0, statically
  # composed via insight::semantic::compose(). One module interface unit each — no partitions (the
  # cross-package BMI closure must not deepen). 1.7.5 ships exactly these two; Jenkins/gcc/cloud are
  # PO-scheduled successors riding the same contract, never pre-built.
  insight_semantic_github:
    path: semantic/github
    version: 1.7.5
    license: Apache-2.0
    public: true
    release: true
    depends: [insight_canon]
  insight_semantic_test_frameworks:
    path: semantic/test_frameworks
    version: 1.7.5
    license: Apache-2.0
    public: true
    release: true
    depends: [insight_canon]
