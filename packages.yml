packages:
  # Core in core/ (the logcraft/server layout): the repo root is the SHELF (README/LICENSE/
  # workflows/packages.yml/scripts/proof), the tree reads like the architecture —
  # core/ = the language, semantic/* = the vocabularies, benchmarks/ = the composed perf harness.
  insight_canon:
    path: core
    version: 1.10.4
    source_public: true
    release: true
    depends: []
  # Semantic packages (ADR-17.D1): per-dialect VOCABULARY (rule rows + code tier), statically
  # composed via insight::semantic::compose(). One module interface unit each — no partitions (the
  # cross-package BMI closure must not deepen). gcc/cloud are PO-scheduled successors riding the
  # same contract, never pre-built. The licence is declared ONCE, in each package's own
  # conanfile.py `license` attribute — that is the value conan carries into package metadata,
  # and pin_coherence INV-20 checks it against `source_public` here.
  insight_semantic_github:
    path: semantic/github
    version: 1.10.4
    source_public: true
    release: true
    depends: [insight_canon]
  insight_semantic_jenkins:
    path: semantic/jenkins
    version: 1.10.4
    source_public: true
    release: true
    depends: [insight_canon]
  insight_semantic_gitlab:
    path: semantic/gitlab
    version: 1.10.4
    source_public: true
    release: true
    depends: [insight_canon]
  insight_semantic_test_frameworks:
    path: semantic/test_frameworks
    version: 1.10.4
    source_public: true
    release: true
    depends: [insight_canon]
  # The composed benchmark harness (ADR-17.D8 · SRC-SP-5): a leaf APPLICATION package — the perf gate
  # must link the vocabulary packages, which core never may (SRC-SP-1 / R1).
  # Built + run by `malf bench`
  # and the on-tag measure-benchmark gate; never published as a release artifact.
  insight_canon_bench:
    path: benchmarks
    version: 1.10.4
    source_public: true
    release: false
    depends: [insight_canon, insight_semantic_github, insight_semantic_gitlab, insight_semantic_jenkins, insight_semantic_test_frameworks]

# ── The build system's INVENTORY (ADR-3.D9) ─────────────────────────────────────────────────────
# Projects that declare their own `project()` and belong to NO conan package. They are NOT
# packages and must not become ones — a package carries one profile and one build, which is
# exactly what would flatten this harness's 8-cell determinism matrix. Inventory membership and
# package membership are two different things (ADR-3.D9); conflating them is what produced the
# orphan. Every entry here is configured + built to a LINKED artifact in ONE canonical cell by
# `malf inventory`, which the build/test sweep runs — so a translation unit can no longer be
# invisible to `malf test` until the tag looks at it.
inventory:
  # proof/ is a REPO-LEVEL harness spanning core/ and semantic/*, which is why no single package
  # could own it — and why it went unbuilt for a whole release cycle at a time. Its first compile
  # used to BE the golden workflow (ADR-3.D9).
  #
  # ⚠ THE BOUNDARY, DECLARED (ADR-3.D9): this entry proves proof/ BUILDS. The 8-cell matrix in
  # scripts/det_public_proof.sh proves it is DETERMINISTIC, at the tag, and is untouched by this.
  # A digest drift still first appears at the cut, BY DESIGN. Do not widen this into an 8-cell run
  # to "make the daily gate complete" — the daily property is compile-and-link, nothing more.
  canon_det_proof:
    path: proof
    toolchain_from: core
    target: det_proof
    defines:
      CANON_ROOT: ${repo}
